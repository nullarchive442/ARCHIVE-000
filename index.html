<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE ARCHIVE // 000</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
--bg:#080a0b;--panel:#0d1112;--border:#20292a;
--text:#c5ceca;--muted:#687571;--green:#a0c8a8;--red:#bd6565;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px 'IBM Plex Mono',monospace}
a{color:var(--green);text-decoration:none}
a:hover{text-decoration:underline}
header{height:62px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 7%}
.logo{color:var(--green);font-weight:600;letter-spacing:3px}
nav{display:flex;gap:20px}
nav a{color:var(--muted);font-size:11px}
nav a.active,nav a:hover{color:var(--green)}
main{width:min(900px,88%);margin:60px auto;min-height:65vh}
.eyebrow{color:var(--green);letter-spacing:2px;font-size:11px;margin-bottom:18px}
h1{font-size:clamp(30px,6vw,52px);letter-spacing:4px;margin:0 0 15px;color:#e1e8e3}
h2{font-size:16px;font-weight:500;color:#dce5df;margin-top:35px}
p{line-height:1.9;color:var(--muted)}
hr{border:0;border-top:1px solid var(--border);margin:30px 0}
.panel{background:var(--panel);border:1px solid var(--border);padding:22px;margin:18px 0}
.panel-title{color:var(--green);font-size:11px;letter-spacing:2px;margin-bottom:17px}
.status{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid #182020}
.status:last-child{border:0}
.status span:first-child{color:var(--muted)}
.status span:last-child{color:var(--green)}
.record{display:flex;justify-content:space-between;padding:17px;border:1px solid var(--border);margin:9px 0;background:var(--panel)}
.record:hover{border-color:var(--green)}
.record-name{color:var(--text)}
.record-state{color:var(--muted);font-size:10px}
button{font-family:inherit;background:transparent;border:1px solid var(--border);color:var(--green);padding:11px 16px;cursor:pointer}
button:hover{background:#15201a;border-color:var(--green)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--green);line-height:1.9;font:inherit}
.terminal{background:#050707;border:1px solid var(--border);padding:20px;min-height:300px}
#output{white-space:pre-wrap;line-height:1.8;color:var(--green);overflow-wrap:anywhere}
.input-line{display:flex;gap:10px;margin-top:15px;align-items:center}
.input-line span{color:var(--green)}
input{background:transparent;border:0;outline:0;color:white;font:13px 'IBM Plex Mono';width:100%}
.warning{color:var(--red)!important}
.small{font-size:11px;color:var(--muted)}
footer{border-top:1px solid var(--border);padding:25px 7%;color:#46504c;font-size:10px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
@media(max-width:600px){header{padding:0 4%;height:58px}.logo{font-size:12px}nav{gap:10px}nav a{font-size:9px}main{margin:40px auto}.panel{padding:16px}}
</style>
</head>
<body>
<header>
<a class="logo" href="#/">THE ARCHIVE</a>
<nav>
<a href="#/">HOME</a>
<a href="#/records">RECORDS</a>
<a href="#/terminal">TERMINAL</a>
<a href="#/about">ABOUT</a>
</nav>
</header>

<main id="app"></main>

<footer>
<span>ARCHIVE-000 // DIGITAL RECORDS DIVISION</span>
<span>CONNECTION: UNSTABLE</span>
</footer>

<script>
const app=document.getElementById("app");
const repo="https://github.com/nullarchive442/ARCHIVE-000";

const unlocked=id=>localStorage.getItem("archive_"+id)==="true";
const unlock=id=>localStorage.setItem("archive_"+id,"true");

const records={
"000":{
title:"RECOVERED RECORD",
status:"RECOVERED",
content:`RECORD ID: 000
ORIGIN: UNKNOWN
RECOVERY STATUS: SUCCESSFUL

OFFSET: +2

NQQM CV VJG HKTUV EQOOKV

No additional data recovered.

END OF RECORD.`
},
"001":{
title:"RECOVERED RECORD",
status:"CORRUPTED",
content:`RECORD ID: 001
STATUS: CORRUPTED

The archive remembers what was removed.
The archive forgets what was added.

One of these statements is false.

KEY: INCOMPLETE

BUG WZSPB BW VBV HTT PRW

END OF RECORD.`
},
"002":{
title:"RECOVERED RECORD",
status:"RECOVERED",
content:`RECORD ID: 002
STATUS: RECOVERED

You found this record.

But the archive says it was opened
before the archive was created.

Check the timestamps.

The clock is not in order.

END OF RECORD.`
},
"003":{
title:"CACHED FRAGMENT",
status:"RECOVERED",
content:`FRAGMENT ID: 003
SOURCE: CACHE
TIMESTAMP: UNKNOWN

17 / 04 / 00

The first record was not the beginning.
The last record was not the end.

Someone has been here before.

END OF FRAGMENT.`
}
};

function home(){
app.innerHTML=`
<div class="eyebrow">ARCHIVE SYSTEM // VERSION 0.02</div>
<h1>ARCHIVE-000</h1>
<p>A collection of recovered digital records. Some files may be incomplete.</p>
<hr>
<div class="panel">
<div class="panel-title">SYSTEM STATUS</div>
<div class="status"><span>Connection</span><span>ESTABLISHED</span></div>
<div class="status"><span>Records indexed</span><span>08</span></div>
<div class="status"><span>Unknown records</span><span class="warning">01</span></div>
<div class="status"><span>Recovered evidence</span><span>${unlocked("002")?"02":"01"}</span></div>
<div class="status"><span>System integrity</span><span>PARTIAL</span></div>
</div>
<h2>RECENT ACTIVITY</h2>
<div class="panel"><pre>
[00:14:02] Archive mounted.
[00:14:03] 8 records detected.
[00:14:09] Index verification failed.
[00:14:12] Unknown record detected.
[00:14:13] Recovery attempted.
[00:14:14] RECORD 000 FOUND.
[00:14:15] Another session detected.
</pre></div>
<p class="small">There is activity in this archive that does not belong to your session.</p>
<button onclick="location.hash='/records'">ACCESS RECORDS →</button>`;
}

function link(id,name,state,locked=false){
return `<a class="record" href="${locked?'#/records':'#/record/'+id}">
<span class="record-name">${name}</span>
<span class="record-state">${locked?"LOCKED":state} →</span>
</a>`;
}

function recordList(){
app.innerHTML=`
<div class="eyebrow">DIRECTORY // 000</div>
<h1>RECORDS</h1>
<p>Available records recovered from the archive.</p>
${link("000","Record 000","RECOVERED")}
${link("001","Record 001","CORRUPTED")}
${link("002","Record 002","RECOVERED",!unlocked("002"))}
${link("003","Record 003","CACHED",!unlocked("003"))}
<hr>
<p class="small">Some records may not appear in this directory.</p>`;
}

function showRecord(id){
if(!records[id]||(id==="002"&&!unlocked("002"))||(id==="003"&&!unlocked("003"))){notFound();return}
const r=records[id];
app.innerHTML=`
<div class="eyebrow">ARCHIVE // RECORD ${id}</div>
<h1>${r.title}</h1>
<div class="panel"><div class="panel-title">DOCUMENT VIEWER</div><pre>${r.content}</pre></div>
<p class="small">STATUS: ${r.status}</p>
<button onclick="location.hash='/records'">← BACK TO RECORDS</button>`;
}

function terminal(){
app.innerHTML=`
<div class="eyebrow">ARCHIVE SYSTEM // COMMAND LINE</div>
<h1>TERMINAL</h1>
<p>Enter a command. Type HELP for available commands.</p>
<div class="terminal">
<div id="output">ARCHIVE TERMINAL [VERSION 0.02]
Connection established.
Type HELP to begin.

</div>
<div class="input-line"><span>ARCHIVE&gt;</span>
<input id="command" autocomplete="off" spellcheck="false" placeholder="Enter command...">
</div></div>`;
const input=document.getElementById("command");
input.addEventListener("keydown",e=>{
if(e.key==="Enter"){runCommand(input.value);input.value=""}
});
input.focus();
}

function print(t){
const o=document.getElementById("output");
o.textContent+="\n"+t+"\n";
o.scrollTop=o.scrollHeight;
}

function runCommand(raw){
const command=raw.trim();
const cmd=command.toUpperCase();
if(!cmd)return;
print("ARCHIVE> "+command);

if(cmd==="HELP"){
print(`AVAILABLE COMMANDS

HELP          Display commands
STATUS        Check system status
LIST          List records
OPEN 000      Open record 000
OPEN 001      Open record 001
OPEN 002      Open record 002
OPEN 003      Open record 003
VERIFY        Verify archive
SEARCH <word> Search archive
EVIDENCE      View recovered evidence
ACCESS 17     Check restricted route
SUBMIT <text> Submit a decoded message
CLEAR         Clear terminal`);
}
else if(cmd==="STATUS"){
print(`CONNECTION: ESTABLISHED
INTEGRITY: PARTIAL
RECORDS: 08
UNKNOWN RECORDS: 01
SESSION: ${sessionId()}`);
}
else if(cmd==="LIST"){
print(`000 — RECOVERED
001 — CORRUPTED
002 — ${unlocked("002")?"RECOVERED":"LOCKED"}
003 — ${unlocked("003")?"CACHED":"LOCKED"}
004 — ERASED
005 — KNOWN
006 — LOST
007 — OBSOLETE
008 — GENERATED`);
}
else if(cmd==="OPEN 000"||cmd==="OPEN 001"){
location.hash="/record/"+cmd.slice(5);
}
else if(cmd==="OPEN 002"||cmd==="OPEN 003"){
const id=cmd.slice(5);
if(unlocked(id))location.hash="/record/"+id;
else print("ERROR: ACCESS DENIED.");
}
else if(cmd==="VERIFY"){
print(`VERIFYING ARCHIVE...
INDEX: FAILED
RECORD 000: VALID
RECORD 001: CORRUPTED
UNKNOWN RECORD: DETECTED`);
}
else if(cmd.startsWith("SEARCH ")){
const term=cmd.slice(7);
if(term==="INCOMPLETE")print("MATCH FOUND: README DESCRIPTION.");
else if(term==="17")print("MATCH FOUND: 1 RESULT. RESTRICTED.");
else print("NO MATCH FOUND.");
}
else if(cmd==="EVIDENCE"){
print(`RECOVERED EVIDENCE:
${unlocked("002")?"[02] RECORD 002 recovered":"[01] RECORD 000 recovered"}
${unlocked("003")?"[03] RECORD 003 recovered":"[--] UNKNOWN"}
`);
}
else if(cmd==="ACCESS 17"){
if(unlocked("003"))location.hash="/recovery/17";
else print("ACCESS DENIED. EVIDENCE INSUFFICIENT.");
}
else if(cmd.startsWith("SUBMIT ")){
const answer=command.slice(7).trim().toUpperCase();
if(answer==="THE INDEX IS NOT THE END"){
unlock("002");
print("ACCESS ACCEPTED. RECORD 002 UNLOCKED.");
}
else if(answer==="THE CLOCK IS NOT IN ORDER"){
if(unlocked("002")){
unlock("003");
print("RECOVERY SUCCESSFUL. RECORD 003 UNLOCKED.");
}else print("INSUFFICIENT EVIDENCE.");
}
else print("SUBMISSION REJECTED.");
}
else if(cmd==="CLEAR"){
document.getElementById("output").textContent="";
}
else print("UNKNOWN COMMAND. TYPE HELP.");
}

function sessionId(){
return sessionStorage.getItem("archive_session")||"0001";
}

function about(){
app.innerHTML=`
<div class="eyebrow">INFORMATION // ARCHIVE</div>
<h1>ABOUT</h1>
<p>ARCHIVE-000 is a digital collection of recovered records, fragments, and system logs.</p>
<div class="panel">
<div class="panel-title">ARCHIVE INFORMATION</div>
<div class="status"><span>Project</span><span>THE ARCHIVE</span></div>
<div class="status"><span>Classification</span><span>UNKNOWN</span></div>
<div class="status"><span>Repository</span><span><a href="${repo}" target="_blank">VIEW SOURCE ↗</a></span></div>
</div>
<p>Not all records are complete. Not all records are reliable.</p>
<p class="warning">Do not assume that the archive is accurate.</p>`;
}

function secret(){
app.innerHTML=`
<div class="eyebrow">RESTRICTED DIRECTORY // 17</div>
<h1>RECOVERY NODE</h1>
<div class="panel">
<div class="panel-title">UNREGISTERED SESSION</div>
<pre>
NODE: 17
STATUS: ACTIVE
ORIGIN: UNRESOLVED

A session was recorded here.
It does not match your session.

LAST MESSAGE:
"YOU ARE NOT THE FIRST."
</pre>
</div>
<p class="warning">This route is not listed in the public directory.</p>
<button onclick="location.hash='/terminal'">RETURN TO TERMINAL</button>`;
}

function notFound(){
app.innerHTML=`
<div class="eyebrow">ERROR // 404</div>
<h1>NOT FOUND</h1>
<p>The requested record does not exist.</p>
<button onclick="location.hash='/'">RETURN HOME</button>`;
}

function router(){
const path=location.hash.slice(1)||"/";
document.querySelectorAll("nav a").forEach(a=>{
a.classList.toggle("active",a.getAttribute("href")==="#"+path);
});
if(path==="/")home();
else if(path==="/records")recordList();
else if(path==="/terminal")terminal();
else if(path==="/about")about();
else if(path==="/recovery/17"){
if(unlocked("003"))secret();else notFound();
}
else if(path.startsWith("/record/"))showRecord(path.split("/")[2]);
else notFound();
}

window.addEventListener("hashchange",router);
if(!sessionStorage.getItem("archive_session")){
sessionStorage.setItem("archive_session","0001");
}
router();
</script>
</body>
</html>
